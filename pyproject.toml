[project]
name = "datalumina-project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
]

# Static-analysis scope. The notebooks/ folder is personal scratch/exploration (see CLAUDE.md),
# not part of the shipped pipeline, so we exclude it from linting and type-checking — its Ruff
# style hints and Pylance stub-noise (matplotlib/pandas/sklearn) shouldn't gate the build.
[tool.ruff]
extend-exclude = ["notebooks"]

[tool.pyright]
# `ignore` (not just `exclude`) so diagnostics stay suppressed even when a notebook is open.
ignore = ["notebooks"]
